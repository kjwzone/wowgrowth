name: Deploy frontend-v15

on:
  push:
    branches: [main]
    paths:
      - "frontend-v15/**"
      - ".github/workflows/deploy-frontend-v15.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v15/package-lock.json

      - name: Validate secrets
        run: |
          missing=0
          [ -z "$VERCEL_TOKEN" ] && echo "::error::VERCEL_TOKEN secret is empty" && missing=1
          [ -z "$VERCEL_ORG_ID" ] && echo "::error::VERCEL_ORG_ID secret is empty" && missing=1
          [ -z "$VERCEL_PROJECT_ID" ] && echo "::error::VERCEL_PROJECT_ID secret is empty" && missing=1
          [ "$missing" -eq 1 ] && exit 1
          echo "Secrets present (ORG prefix: ${VERCEL_ORG_ID:0:5}***, PROJECT: ${VERCEL_PROJECT_ID:0:8}***)"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pull Vercel project settings
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt dist to Vercel
        id: deploy
        run: |
          set -euo pipefail
          url="$(npx vercel@latest deploy dist --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee deploy.log | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"
